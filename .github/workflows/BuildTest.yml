name: windows_build_test
on: [pull_request]
env:
  SOLUTION_FILE_PATH: src/NimaEngine.sln

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build
        run: |
          msbuild ${{env.SOLUTION_FILE_PATH}} /t:Clean /p:Platform=x64,Configuration=${{matrix.configuration}}
          msbuild ${{env.SOLUTION_FILE_PATH}} /t:Build /p:Platform=x64,Configuration=${{matrix.configuration}}
